name: docker-publish

# Builds all three project images and pushes them to Docker Hub.
#
# Prerequisites (one-time): add two repository secrets under
#   GitHub repo → Settings → Secrets and variables → Actions:
#     DOCKERHUB_USERNAME  = your Docker Hub username
#     DOCKERHUB_TOKEN     = a Docker Hub access token (Account Settings →
#                           Security → New Access Token, with Read/Write scope)
#
# Trigger it either way:
#   • Manually:  Actions tab → "docker-publish" → Run workflow
#   • On release: push a tag like  v1.0.0
#
# Images published (under your Docker Hub namespace):
#   <username>/cloud-log-access-bff       (the Go BFF)
#   <username>/cloud-log-access-seed      (the one-shot seeder)
#   <username>/cloud-log-access-frontend  (the React SPA + nginx)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: cloud-log-access-bff
            context: ./backend
            target: server
          - image: cloud-log-access-seed
            context: ./backend
            target: seed
          - image: cloud-log-access-frontend
            context: ./frontend
            target: '' # frontend Dockerfile has a single final stage

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
