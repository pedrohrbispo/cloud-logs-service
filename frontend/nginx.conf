# nginx-unprivileged serves the built SPA on :8080 and reverse-proxies /api to
# the Go BFF so the browser only ever talks to one origin (zero CORS).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Reverse proxy → BFF (same-origin /api). Override the upstream with the
  # BFF_UPSTREAM build/runtime if needed; defaults to the compose service name.
  location /api {
    proxy_pass http://bff:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass_header Authorization;

    # Stream downloads through without buffering the whole object.
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
  }

  # Long-cache fingerprinted assets; never cache the HTML shell.
  # NOTE: cache control uses `expires` (not `add_header`) on purpose — an
  # `add_header` inside a location resets ALL inherited add_header directives,
  # which would silently drop the security headers below. `expires` does not.
  location /assets/ {
    expires 1y;
  }
  location = /index.html {
    expires -1;
  }

  # ── Security headers ──────────────────────────────────────────────────────
  # The no-flash <script> in index.html is inline, so it is whitelisted by its
  # sha256 content hash (regenerated by scripts/csp-hash.mjs on every build).
  # 'unsafe-inline' is retained only for style-src (Tailwind + Google Fonts).
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-g/58DX+MfHJxyAXOcg0sHCCPNrnlsAsDLp2J6Vcfkz4='; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;
}
