<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <!-- No-flash theme script: resolves light/dark/system BEFORE first paint.
         Must stay the first element in <head>. CSP whitelists it by sha256 hash
         (see nginx.conf / scripts/csp-hash.mjs). -->
    <script>
      (function () {
        try {
          var KEY = 'cla_theme',
            LEGACY = 'cla_dark',
            pref = localStorage.getItem(KEY);
          if (!pref) {
            var old = localStorage.getItem(LEGACY);
            pref = old === '1' ? 'dark' : old === '0' ? 'light' : 'system';
            localStorage.setItem(KEY, pref);
            if (old !== null) localStorage.removeItem(LEGACY);
          }
          var sys = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var r = pref === 'system' ? sys : pref,
            el = document.documentElement;
          el.setAttribute('data-theme', r);
          el.style.colorScheme = r;
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Cloud Log Access</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
